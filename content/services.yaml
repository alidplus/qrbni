            - داشبوردهای ادمین
            - پرتال مشتری
            - مارکت‌پلیس
      - key: mvp
        title:
          en: MVP Development
          fa: توسعه MVP
        summary:
          en: Ship a production-ready MVP for founders validating a product bet.
          fa: تحویل MVP آماده پروداکشن برای بنیان‌گذاران در حال اعتبارسنجی محصول.
