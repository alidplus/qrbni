          fa:
            - REST و GraphQL
            - احراز هویت
            - پرداخت
            - SDK و مستندات

  - key: architecture-consulting
    sort: 2
    title:
      en: Architecture & Consulting
      fa: معماری و مشاوره
    description:
      en: Reviews, audits, and fractional technical leadership.
      fa: بازبینی، ممیزی و رهبری فنی پاره‌وقت.
    services:
      - key: architecture-review
        title:
          en: Architecture Review
          fa: بازبینی معماری
        summary:
          en: Map bottlenecks, security risks, and a prioritized refactoring roadmap.
          fa: نقشه گلوگاه‌ها، ریسک‌های امنیتی و نقشه بازآرایی اولویت‌بندی‌شده.
        bullets:
          en:
            - Codebase review
            - Risk map
            - Prioritized improvements
          fa:
            - بازبینی کدبیس
            - نقشه ریسک
            - بهبودهای اولویت‌دار
      - key: code-audit
        title:
          en: Code Audit
          fa: ممیزی کد
        summary:
          en: Independent review before launch or investment decisions.
          fa: بازبینی مستقل پیش از لانچ یا تصمیم سرمایه‌گذاری.
        bullets:
          en:
            - Quality & maintainability
            - Security & scalability
            - Technical debt
          fa:
            - کیفیت و نگهداری‌پذیری
            - امنیت و مقیاس‌پذیری
            - بدهی فنی
      - key: cto-advisory
        title:
          en: CTO Advisory
          fa: مشاوره CTO
        summary:
          en: Fractional technical leadership when a full-time CTO is not the fit yet.
          fa: رهبری فنی پاره‌وقت وقتی CTO تمام‌وقت هنوز مناسب نیست.
        bullets:
          en:
            - Hiring advice
            - Architecture decisions
            - Roadmaps & mentoring
          fa:
            - مشاوره استخدام
            - تصمیم‌های معماری
            - نقشه راه و منتورینگ

