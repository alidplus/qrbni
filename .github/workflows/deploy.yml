name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NOCODB_BASE_URL: ${{ vars.NOCODB_BASE_URL }}
      NOCODB_API_TOKEN: ${{ secrets.NOCODB_API_TOKEN }}
      TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install
        run: npm ci

      - name: Resolve target
        id: target
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "url=https://qrbni.dev" >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "url=https://preview.qrbni.dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Default NocoDB base URL
        run: |
          if [ -z "${NOCODB_BASE_URL}" ]; then
            echo "NOCODB_BASE_URL=https://app.nocodb.com" >> "$GITHUB_ENV"
          fi

      - name: Check required secrets
        run: |
          missing=()
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NOCODB_API_TOKEN TURNSTILE_SITE_KEY TURNSTILE_SECRET REVALIDATE_SECRET; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required GitHub secrets/vars: ${missing[*]}"
            exit 1
          fi

      - name: Build OpenNext
        run: npx opennextjs-cloudflare build

      - name: Deploy Worker
        run: npx opennextjs-cloudflare deploy --env "${{ steps.target.outputs.env }}"

      - name: Sync Worker secrets
        run: |
          python3 - <<'PY' | npx wrangler secret bulk --env "${{ steps.target.outputs.env }}"
          import json, os
          keys = [
              "NOCODB_BASE_URL",
              "NOCODB_API_TOKEN",
              "TURNSTILE_SITE_KEY",
              "TURNSTILE_SECRET",
              "REVALIDATE_SECRET",
          ]
          print(json.dumps({k: os.environ[k] for k in keys}))
          PY

      - name: Deployment summary
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: \`${{ steps.target.outputs.env }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.target.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
