name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NOCODB_BASE_URL: ${{ vars.NOCODB_BASE_URL }}
      NOCODB_API_TOKEN: ${{ secrets.NOCODB_API_TOKEN }}
      TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      # Prefer IPv4 — some runners hit flaky IPv6 paths to api.cloudflare.com
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install
        run: npm ci

      - name: Resolve target
        id: target
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "worker=qrbni" >> "$GITHUB_OUTPUT"
            echo "url=https://qrbni.dev" >> "$GITHUB_OUTPUT"
            echo "deploy_args=--env production" >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "worker=qrbni-preview" >> "$GITHUB_OUTPUT"
            echo "url=https://preview.qrbni.dev" >> "$GITHUB_OUTPUT"
            # Top-level wrangler config is preview — no --env
            echo "deploy_args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Sanitize Cloudflare credentials
        run: |
          # Trim whitespace/newlines from secrets (common copy/paste issue).
          # Use GITHUB_ENV delimiters so values are not corrupted.
          account="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID}" | tr -d '[:space:]')"
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN}" | tr -d '[:space:]')"
          if [ -z "$token" ] || [ -z "$account" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID missing after sanitize"
            exit 1
          fi
          if ! [[ "$account" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID must be 32 hex chars (got length ${#account})"
            exit 1
          fi
          {
            echo "CLOUDFLARE_ACCOUNT_ID<<CFEOF"
            echo "$account"
            echo "CFEOF"
            echo "CLOUDFLARE_API_TOKEN<<CFEOF"
            echo "$token"
            echo "CFEOF"
          } >> "$GITHUB_ENV"
          echo "Cloudflare account id length=${#account}; token length=${#token}"

      - name: Default NocoDB base URL
        run: |
          if [ -z "${NOCODB_BASE_URL}" ]; then
            echo "NOCODB_BASE_URL=https://app.nocodb.com" >> "$GITHUB_ENV"
          fi

      - name: Check required app secrets
        run: |
          missing=()
          for key in NOCODB_API_TOKEN TURNSTILE_SITE_KEY TURNSTILE_SECRET REVALIDATE_SECRET; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required GitHub secrets/vars: ${missing[*]}"
            exit 1
          fi

      - name: Preflight Cloudflare API
        run: |
          verify_code="$(curl -sS -o /tmp/cf-verify.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          echo "tokens/verify HTTP ${verify_code}"
          scripts_code="$(curl -sS -o /tmp/cf-preflight.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts?per_page=1")"
          echo "workers/scripts HTTP ${scripts_code}"
          python3 - "$verify_code" "$scripts_code" <<'PY'
          import json, sys
          verify_code, scripts_code = int(sys.argv[1]), int(sys.argv[2])

          def load(path):
              raw = open(path).read()
              try:
                  return json.loads(raw) if raw else {}
              except json.JSONDecodeError:
                  print(raw[:1500])
                  return {"success": False, "errors": [{"message": "non-JSON response"}]}

          verify = load("/tmp/cf-verify.json")
          scripts = load("/tmp/cf-preflight.json")
          print("tokens/verify:", json.dumps(verify, indent=2)[:1200])
          print("workers/scripts:", json.dumps(scripts, indent=2)[:1200])

          if verify_code != 200 or not verify.get("success"):
              raise SystemExit(
                  "CLOUDFLARE_API_TOKEN failed verification. Create a User API Token at "
                  "https://dash.cloudflare.com/profile/api-tokens with permissions: "
                  "Account.Cloudflare Workers Scripts:Edit (include the correct account), "
                  "then update the GitHub secret."
              )
          if scripts_code != 200 or not scripts.get("success"):
              raise SystemExit(
                  "Token is valid but cannot list Workers on CLOUDFLARE_ACCOUNT_ID. "
                  "Confirm the account id matches the token's account resource, and that "
                  "the token includes Workers Scripts Edit for that account."
              )
          print("Cloudflare API preflight ok")
          PY
          npx wrangler whoami

      - name: Build OpenNext
        run: npx opennextjs-cloudflare build

      - name: Deploy Worker
        run: |
          set -uo pipefail
          target_env="${{ steps.target.outputs.env }}"
          attempt=1
          max=3
          while true; do
            echo "Deploy attempt ${attempt}/${max} (worker=${{ steps.target.outputs.worker }})"
            if [ "$target_env" = "production" ]; then
              npx opennextjs-cloudflare deploy --env production && exit 0
            else
              npx opennextjs-cloudflare deploy && exit 0
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "Deploy failed after ${max} attempts"
              exit 1
            fi
            sleep $((attempt * 20))
            attempt=$((attempt + 1))
          done

      - name: Sync Worker secrets
        run: |
          python3 - <<'PY' > /tmp/worker-secrets.json
          import json, os
          keys = [
              "NOCODB_BASE_URL",
              "NOCODB_API_TOKEN",
              "TURNSTILE_SITE_KEY",
              "TURNSTILE_SECRET",
              "REVALIDATE_SECRET",
          ]
          print(json.dumps({k: os.environ[k] for k in keys}))
          PY
          if [ "${{ steps.target.outputs.env }}" = "production" ]; then
            npx wrangler secret bulk /tmp/worker-secrets.json --env production
          else
            npx wrangler secret bulk /tmp/worker-secrets.json
          fi
          rm -f /tmp/worker-secrets.json

      - name: Deployment summary
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: \`${{ steps.target.outputs.env }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: \`${{ steps.target.outputs.worker }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.target.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
